# The CI of splay: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build, test and typecheck run on three systems and two Node.js versions, and
# npm pack --dry-run shows the files of the tarball.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@02fda5f29cc4edb08cd7e3c493be8fea055ffb22 # main
    with:
      scripts: build test typecheck
      node-versions: '["22", "24"]'
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # The files of the tarball
      run: npm pack --dry-run

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@02fda5f29cc4edb08cd7e3c493be8fea055ffb22 # main
    permissions:
      contents: read

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@02fda5f29cc4edb08cd7e3c493be8fea055ffb22 # main
        with:
          needs: ${{ toJSON(needs) }}
