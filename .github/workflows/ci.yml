# The CI of splay: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build, test and typecheck run on three systems and two Node.js versions, and
# npm pack --dry-run shows the files of the tarball.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@dc3de2a28987ed799a7dcdc6b39b81ec3b2f75a6 # main
    with:
      scripts: build test typecheck
      node-versions: '["22", "24"]'
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # The files of the tarball
      run: npm pack --dry-run
